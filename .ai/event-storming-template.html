<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Event Storming Template</title>
  <style>
    body {
      margin: 0;
      background: #f7f7f7;
    }
    svg {
      width: 100%;
      height: 100vh;
      display: block;
    }
  </style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
  <defs>
    <style>
      .command { fill: #4A90E2; stroke: #2E5C8A; stroke-width: 2; }
      .event { fill: #FF9500; stroke: #CC7700; stroke-width: 2; }
      .rule { fill: #FFD700; stroke: #CCB000; stroke-width: 2; }
      .actor { fill: #FFEB3B; stroke: #C5B800; stroke-width: 1; }
      .external { fill: #FF69B4; stroke: #CC5490; stroke-width: 2; }
      .aggregate { fill: #FFFBEA; stroke: #F4C542; stroke-width: 3; stroke-dasharray: 5,5; }
      .arrow { stroke: #333; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .text { font-family: Arial, sans-serif; font-size: 14px; text-anchor: middle; }
      .text-small { font-size: 11px; }
      .text-white { fill: white; }
      .text-black { fill: black; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#333" />
    </marker>
  </defs>

  <title>Event Storming Diagram</title>
  <desc>Event storming visualization for [Domain Object Name]</desc>

  <rect class="aggregate" x="50" y="50" width="1100" height="700" rx="10" />
  <text class="text text-black" x="600" y="80" font-size="18" font-weight="bold">Domain Object Name</text>

  <!-- Example components -->
  <!-- Actors, commands, rules, events, arrows -->
  <!-- ... -->
</svg>
</body>
</html>
